[project]
name = "signos-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/.ruff_cache"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Bind-mounted ./tests is host-owned; keep the cache off that mount so the
# container's non-root user can always write it.
cache_dir = "/tmp/.pytest_cache"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
data_file = "/tmp/.coverage"
