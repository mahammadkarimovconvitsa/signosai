services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signos}
      POSTGRES_USER: ${POSTGRES_USER:-signos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signos} -d ${POSTGRES_DB:-signos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signos}:${POSTGRES_PASSWORD:-signos}@postgres:5432/${POSTGRES_DB:-signos}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signos}:${POSTGRES_PASSWORD:-signos}@postgres:5432/${POSTGRES_DB:-signos}_test
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./docs:/app/docs

volumes:
  postgres_data:
